name: Tests

on:
  # Every branch, not just main. A branch could previously be pushed and
  # reviewed for days with no CI at all, because nothing ran until a pull
  # request was opened — which is how a fatal that broke the package on every
  # Laravel 11+ install reached PR stage unnoticed. Runs take ~30s.
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [8.2, 8.3, 8.4]
        laravel: [12.*, 13.*]
        exclude:
          # Laravel 13 requires PHP 8.3+.
          - php: 8.2
            laravel: 13.*
        include:
          # composer.json claims ^10.0 and ^11.0, so they get tested. Both are
          # end of life for security patches, so their advisories must not gate
          # a merge — these legs report but do not block.
          #
          # Testing what we claim is not optional: a fatal that broke every
          # Laravel 11+ install once reached PR stage precisely because the
          # matrix jumped 10 to 12.
          - php: 8.2
            laravel: 10.*
            eol: true
          - php: 8.2
            laravel: 11.*
            eol: true

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}${{ matrix.eol && ' (EOL, non-blocking)' || '' }}

    continue-on-error: ${{ matrix.eol == true }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, sqlite3
          coverage: none

      - name: Set Laravel version
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" "illuminate/http:${{ matrix.laravel }}" "illuminate/routing:${{ matrix.laravel }}" "illuminate/database:${{ matrix.laravel }}" "illuminate/cache:${{ matrix.laravel }}" "illuminate/console:${{ matrix.laravel }}" "illuminate/events:${{ matrix.laravel }}" "illuminate/bus:${{ matrix.laravel }}" "illuminate/queue:${{ matrix.laravel }}" "illuminate/notifications:${{ matrix.laravel }}" --no-interaction --no-update

      # EOL legs only. Composer 2.10 refuses to install *any* Laravel 10.x or
      # 11.x release, because every one of them carries an unpatched advisory
      # and advisory blocking is now on by default — the install fails outright
      # rather than warning. That is correct behaviour for a real project and
      # exactly why these two majors left the matrix in v1.4.0.
      #
      # We opt out here and nowhere else. composer.json still claims ^10.0 and
      # ^11.0, and untested support is not support: a fatal on every Laravel
      # 11+ install once reached PR stage precisely because nothing exercised
      # that range. The container is ephemeral, handles no data and ships
      # nothing, so installing a vulnerable framework to run a test suite costs
      # nothing — while leaving those users untested costs them.
      #
      # The blocking legs keep advisory protection. Users on these versions are
      # warned at runtime by threat-detection:doctor.
      - name: Allow advisory-blocked install (EOL legs only)
        if: matrix.eol
        run: composer config policy.advisories.block false

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  # sqlite treats a varchar width as advisory and accepts an over-long value
  # silently, so two findings could not be observed on it: TD-012, where an
  # over-long geo value aborted the enrichment loop mid-run and left every
  # later row unenriched, and TD-006, which turns on a NOT NULL column
  # accepting the empty string. Both were reproduced on MariaDB by hand during
  # the v1.8.0 audit and then had no way to run again.
  #
  # These tests skip unless THREAT_DETECTION_MYSQL=1, so the rest of the matrix
  # is unaffected and a contributor without a database still gets a green run.
  # This job is the only place they actually execute.
  database:
    runs-on: ubuntu-latest
    name: Strict-mode database (MySQL)

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: threat_detection_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, sqlite3, pdo_mysql
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      # A skipped test is a green test. Without the skip check this job would
      # pass just as happily with the database unreachable and every case
      # skipped — which is precisely the failure it exists to prevent, since
      # this is the only place these tests ever execute.
      - name: Run the strict-mode database tests
        env:
          THREAT_DETECTION_MYSQL: '1'
          THREAT_DETECTION_MYSQL_HOST: 127.0.0.1
          THREAT_DETECTION_MYSQL_PORT: '3306'
          THREAT_DETECTION_MYSQL_DATABASE: threat_detection_test
          THREAT_DETECTION_MYSQL_USERNAME: root
          THREAT_DETECTION_MYSQL_PASSWORD: ''
        run: |
          set -o pipefail
          vendor/bin/phpunit tests/Security/MysqlStrictModeTest.php tests/Security/MysqlActorSignalsTest.php tests/Security/MysqlHostileBytesTest.php tests/Security/MysqlDateBucketingTest.php | tee result.txt
          if grep -qi 'skipped' result.txt; then
            echo "::error::The strict-mode tests skipped instead of running. They execute nowhere else, so a skip means they never ran at all."
            exit 1
          fi

  # PostgreSQL is stricter than SQLite and MySQL about types and encoding. The
  # suite's SQLite hid `boolean = integer` in /stats, which failed the whole
  # endpoint on every PostgreSQL install. Like the MySQL job, a skip here
  # means the tests never ran anywhere, so it fails.
  postgres:
    runs-on: ubuntu-latest
    name: PostgreSQL

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: threat_detection_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, sqlite3, pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run the PostgreSQL tests
        env:
          THREAT_DETECTION_PGSQL: '1'
          THREAT_DETECTION_PGSQL_HOST: 127.0.0.1
          THREAT_DETECTION_PGSQL_PORT: '5432'
          THREAT_DETECTION_PGSQL_DATABASE: threat_detection_test
          THREAT_DETECTION_PGSQL_USERNAME: postgres
          THREAT_DETECTION_PGSQL_PASSWORD: postgres
        run: |
          set -o pipefail
          vendor/bin/phpunit tests/Security/PostgresCompatibilityTest.php | tee pg-result.txt
          if grep -qi 'skipped' pg-result.txt; then
            echo "::error::The PostgreSQL tests skipped instead of running. They execute nowhere else, so a skip means they never ran at all."
            exit 1
          fi

  quality:
    runs-on: ubuntu-latest
    name: Lint & static analysis

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      # Style and static analysis do not vary across the matrix, so they run
      # once on the newest supported PHP rather than seven times.
      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      # A pattern compiled with PCRE JIT stays cached that way, so the test
      # proving a failed normalisation step cannot empty the payload only runs
      # in a process started with JIT off — which is also how some hardened
      # hosts run. Everywhere else it skips, so a skip here means it never ran.
      - name: Regex-failure handling with PCRE JIT disabled
        run: |
          set -o pipefail
          php -d pcre.jit=0 vendor/bin/phpunit tests/Feature/PatternFailureTest.php | tee jit.txt
          if grep -qi 'skipped' jit.txt; then
            echo "::error::The JIT-off regex-failure tests skipped instead of running."
            exit 1
          fi

  coverage:
    runs-on: ubuntu-latest
    name: Coverage

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, sqlite3
          coverage: pcov

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests with coverage
        run: vendor/bin/phpunit --coverage-clover=coverage.xml

      # A gate, not a badge. No upload, no token, and no third party holding
      # repo access — which matters more than usual for a security package.
      # The percentage is written to the run summary so it is visible without
      # opening the logs. Raise the minimum as coverage improves.
      - name: Enforce minimum coverage
        run: php .github/coverage-threshold.php coverage.xml 60
