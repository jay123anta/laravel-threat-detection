name: Tests

on:
  # Every branch, not just main. A branch could previously be pushed and
  # reviewed for days with no CI at all, because nothing ran until a pull
  # request was opened — which is how a fatal that broke the package on every
  # Laravel 11+ install reached PR stage unnoticed. Runs take ~30s.
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [8.2, 8.3, 8.4]
        laravel: [12.*, 13.*]
        exclude:
          # Laravel 13 requires PHP 8.3+.
          - php: 8.2
            laravel: 13.*
        include:
          # composer.json claims ^10.0 and ^11.0, so they get tested. Both are
          # end of life for security patches, so their advisories must not gate
          # a merge — these legs report but do not block.
          #
          # Testing what we claim is not optional: a fatal that broke every
          # Laravel 11+ install once reached PR stage precisely because the
          # matrix jumped 10 to 12.
          - php: 8.2
            laravel: 10.*
            eol: true
          - php: 8.2
            laravel: 11.*
            eol: true

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}${{ matrix.eol && ' (EOL, non-blocking)' || '' }}

    continue-on-error: ${{ matrix.eol == true }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, sqlite3
          coverage: none

      - name: Set Laravel version
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" "illuminate/http:${{ matrix.laravel }}" "illuminate/routing:${{ matrix.laravel }}" "illuminate/database:${{ matrix.laravel }}" "illuminate/cache:${{ matrix.laravel }}" "illuminate/console:${{ matrix.laravel }}" "illuminate/events:${{ matrix.laravel }}" "illuminate/bus:${{ matrix.laravel }}" "illuminate/queue:${{ matrix.laravel }}" "illuminate/notifications:${{ matrix.laravel }}" --no-interaction --no-update

      # EOL legs only. Composer 2.10 refuses to install *any* Laravel 10.x or
      # 11.x release, because every one of them carries an unpatched advisory
      # and advisory blocking is now on by default — the install fails outright
      # rather than warning. That is correct behaviour for a real project and
      # exactly why these two majors left the matrix in v1.4.0.
      #
      # We opt out here and nowhere else. composer.json still claims ^10.0 and
      # ^11.0, and untested support is not support: a fatal on every Laravel
      # 11+ install once reached PR stage precisely because nothing exercised
      # that range. The container is ephemeral, handles no data and ships
      # nothing, so installing a vulnerable framework to run a test suite costs
      # nothing — while leaving those users untested costs them.
      #
      # The blocking legs keep advisory protection. Users on these versions are
      # warned at runtime by threat-detection:doctor.
      - name: Allow advisory-blocked install (EOL legs only)
        if: matrix.eol
        run: composer config policy.advisories.block false

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit